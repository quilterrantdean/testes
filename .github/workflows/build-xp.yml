name: Compilar MPlayer para Windows XP (32-bits)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

env:
  # Prefixo das dependencias estaticas (fora do sysroot do mingw, para poder ser colocado em cache)
  DEPS: /home/runner/deps
  DEPS_CPPFLAGS: -D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DXML_STATIC
  DEPS_CFLAGS: -O2 -mtune=prescott

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Instalar ferramentas de compilacao cruzada
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 \
            binutils-mingw-w64-i686 \
            yasm \
            nasm \
            make \
            git \
            pkg-config \
            libtool \
            autoconf \
            automake \
            gperf \
            curl \
            xz-utils \
            fonts-dejavu-core

      - name: Limpar ficheiros compilados residuais
        run: |
          rm -f *.o *.d *.exe config.h config.mak config.log codecs.conf.h version.h
          rm -f */*.o */*.d */*/*.o */*/*.d

      - name: Assegurar presenca do FFmpeg
        run: |
          if [ ! -d "ffmpeg" ]; then
            git clone -b master --depth 1 https://github.com/sherpya/FFmpeg.git ffmpeg
          fi

      - name: Atribuir permissoes de execucao aos scripts
        run: |
          chmod +x configure version.sh help/*.sh 2>/dev/null || true

      - name: Aplicar correccoes de compatibilidade para Windows XP
        run: |
          # 1. Impede a forca do subsistema Windows Vista no configure
          sed -i 's/_WIN32_WINNT=0x0600/_WIN32_WINNT=0x0501/g' configure

          # 2. Define a constante ausente do FFmpeg para cabecalhos do XP
          sed -i '1i #ifndef WC_ERR_INVALID_CHARS\n#define WC_ERR_INVALID_CHARS 0x00000080\n#endif' ffmpeg/libavutil/wchar_filename.h

      # ---------------------------------------------------------------
      # Dependencias de OSD/legendas: iconv + expat + FreeType + fontconfig
      # (a chave da cache muda sempre que qualquer workflow for alterado)
      # ---------------------------------------------------------------
      - name: Cache das dependencias estaticas
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/deps
          key: deps-i686-xp-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Compilar dependencias estaticas (iconv, expat, FreeType, fontconfig)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          HOST=i686-w64-mingw32
          SRC="$RUNNER_TEMP/src"
          mkdir -p "$SRC" "$DEPS"

          export CPPFLAGS="$DEPS_CPPFLAGS -I$DEPS/include"
          export CFLAGS="$DEPS_CFLAGS"
          export LDFLAGS="-L$DEPS/lib"
          # Isola do pkg-config do sistema anfitriao (evita apanhar libs de Linux)
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_PATH

          # --- libiconv ---
          cd "$SRC"
          curl -fsSL https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz | tar xz
          cd libiconv-1.17
          ./configure --host=$HOST --prefix="$DEPS" \
            --enable-static --disable-shared --disable-nls
          make -j"$(nproc)"
          make install

          # --- expat ---
          cd "$SRC"
          curl -fsSL https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.xz | tar xJ
          cd expat-2.6.4
          ./configure --host=$HOST --prefix="$DEPS" \
            --enable-static --disable-shared \
            --without-docbook --without-examples --without-tests
          make -j"$(nproc)"
          make install

          # --- FreeType (versao fixa; instala o freetype-config que o configure do MPlayer procura) ---
          cd "$SRC"
          git clone --depth 1 --branch VER-2-13-3 https://gitlab.freedesktop.org/freetype/freetype.git
          cd freetype
          ./autogen.sh
          PKG_CONFIG="false" ./configure --host=$HOST --prefix="$DEPS" \
            --enable-static --disable-shared \
            --enable-freetype-config \
            --without-zlib --without-bzip2 --without-png \
            --without-harfbuzz --without-brotli
          make -j"$(nproc)"
          make install

          # --- fontconfig ---
          cd "$SRC"
          curl -fsSL https://www.freedesktop.org/software/fontconfig/release/fontconfig-2.14.2.tar.xz | tar xJ
          cd fontconfig-2.14.2
          ./configure --host=$HOST --prefix="$DEPS" \
            --enable-static --disable-shared \
            --disable-docs --disable-nls --disable-cache-build \
            --with-expat="$DEPS"
          make -j"$(nproc)"
          make install

          # Em ligacao estatica o pkg-config nao inclui Libs.private: acrescentar o expat
          sed -i 's|^Libs:.*|& -lexpat|' "$DEPS/lib/pkgconfig/fontconfig.pc"

          # Verificar que tudo o que e preciso ficou instalado
          ls -l "$DEPS/lib/libiconv.a" "$DEPS/lib/libexpat.a" \
                "$DEPS/lib/libfreetype.a" "$DEPS/lib/libfontconfig.a" \
                "$DEPS/bin/freetype-config" "$DEPS/etc/fonts/fonts.conf"

      - name: Executar configure do MPlayer
        shell: bash
        run: |
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          unset PKG_CONFIG_PATH
          # freetype-config e procurado no PATH
          export PATH="$DEPS/bin:$PATH"
          # FreeType e fontconfig ficam em modo automatico: o passo seguinte falha se nao forem detectados
          ./configure \
            --enable-cross-compile \
            --target=i686-mingw32 \
            --cc=i686-w64-mingw32-gcc \
            --as=i686-w64-mingw32-as \
            --ar=i686-w64-mingw32-ar \
            --ranlib=i686-w64-mingw32-ranlib \
            --windres=i686-w64-mingw32-windres \
            --host-cc=gcc \
            --with-arch=prescott \
            --with-tune=prescott \
            --disable-gui \
            --enable-static \
            --enable-fastmemcpy \
            --enable-win32dll \
            --enable-directx \
            --enable-direct3d \
            --enable-gl \
            --enable-win32waveout \
            --enable-mmx \
            --enable-mmxext \
            --enable-sse \
            --enable-sse2 \
            --enable-sse3 \
            --disable-ssse3 \
            --disable-sse4 \
            --disable-sse42 \
            --disable-avx \
            --disable-avx2 \
            --disable-xop \
            --disable-fma3 \
            --disable-fma4 \
            --enable-runtime-cpudetection \
            --extra-cflags="-I$DEPS/include -O2 -march=prescott -mtune=prescott -DWINVER=0x0501 -D_WIN32_WINNT=0x0501 -DWC_ERR_INVALID_CHARS=0x00000080 -Wno-int-conversion -Wno-incompatible-pointer-types" \
            --extra-ldflags="-L$DEPS/lib -static -static-libgcc -Wl,--subsystem,console:5.1" \
            2>&1 | tee configure-out.txt

      - name: Verificar deteccao de FreeType, fontconfig e iconv
        shell: bash
        run: |
          echo "=== Linhas relevantes do configure ==="
          grep -iE 'freetype|fontconfig|iconv' configure-out.txt || true
          echo "=== config.h ==="
          grep -E 'CONFIG_(FREETYPE|FONTCONFIG|ICONV|BITMAP_FONT)\b' config.h || true

          falhou=0
          for opt in FREETYPE FONTCONFIG; do
            if ! grep -q "^#define CONFIG_${opt} 1" config.h; then
              echo "::error::CONFIG_${opt} nao esta activo no config.h. Ver o artefacto 'diagnostico-configure' (config.log)."
              falhou=1
            fi
          done
          exit $falhou

      - name: Compilar
        run: make -j$(nproc)

      - name: Reduzir tamanho dos executaveis (strip)
        run: |
          i686-w64-mingw32-strip -s mplayer.exe
          i686-w64-mingw32-strip -s mencoder.exe

      - name: Preparar pacote (executaveis, configuracao do fontconfig e fonte de reserva)
        run: |
          mkdir -p dist
          cp mplayer.exe mencoder.exe dist/
          # Configuracao do fontconfig (mesma estrutura do binario original: fonts/fonts.conf + fonts/conf.d)
          cp -rL "$DEPS/etc/fonts" dist/fonts
          # Fonte de reserva para o OSD (licenca livre)
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf dist/subfont.ttf
          ls -lR dist

      - name: Guardar executaveis (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: mplayer-xp-prescott
          path: dist

      - name: Guardar diagnostico do configure (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-configure
          path: |
            config.log
            configure-out.txt
            config.h
            config.mak
          if-no-files-found: warn